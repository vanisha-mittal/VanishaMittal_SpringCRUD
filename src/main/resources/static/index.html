<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            padding: 20px;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-custom {
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }

        table {
            color: white;
        }

        th {
            font-weight: 500;
        }

        .title {
            font-weight: 600;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <h2 class="text-center text-white mb-4 title">🎓 Student Management System</h2>

    <!-- FORM -->
    <div class="glass-card mb-4">
        <h4>Add / Update Student</h4>

        <input type="hidden" id="studentId">

        <div class="row mt-3">
            <div class="col-md-4 mb-2">
                <input type="text" id="name" class="form-control" placeholder="Name">
            </div>
            <div class="col-md-4 mb-2">
                <input type="email" id="email" class="form-control" placeholder="Email">
            </div>
            <div class="col-md-4 mb-2">
                <button class="btn btn-success btn-custom w-100" onclick="saveStudent()">Save</button>
            </div>
        </div>
    </div>

    <!-- TABLE -->
    <div class="glass-card">
        <h4>Student List</h4>

        <table class="table mt-3 table-borderless">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="studentTable"></tbody>
        </table>
    </div>

</div>

<script>
    const API = "http://localhost:8080/students";

    function loadStudents() {
        fetch(API)
            .then(res => res.json())
            .then(data => {
                let rows = "";

                data.forEach(s => {
                    rows += `
                        <tr>
                            <td>${s.id}</td>
                            <td>${s.name}</td>
                            <td>${s.email}</td>
                            <td>
                                <button class="btn btn-warning btn-sm btn-custom"
                                    onclick="editStudent(${s.id}, '${s.name}', '${s.email}')">✏️</button>

                                <button class="btn btn-danger btn-sm btn-custom"
                                    onclick="deleteStudent(${s.id})">🗑️</button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById("studentTable").innerHTML = rows;
            });
    }

    function saveStudent() {
        const id = document.getElementById("studentId").value;
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;

        const student = { name, email };

        if (id) {
            fetch(`${API}/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(student)
            }).then(() => {
                resetForm();
                loadStudents();
            });
        } else {
            fetch(API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(student)
            }).then(() => {
                resetForm();
                loadStudents();
            });
        }
    }

    function editStudent(id, name, email) {
        document.getElementById("studentId").value = id;
        document.getElementById("name").value = name;
        document.getElementById("email").value = email;
    }

    function deleteStudent(id) {
        if (confirm("Delete this student?")) {
            fetch(`${API}/${id}`, {
                method: "DELETE"
            }).then(() => loadStudents());
        }
    }

    function resetForm() {
        document.getElementById("studentId").value = "";
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
    }

    window.onload = loadStudents;
</script>

</body>
</html>
