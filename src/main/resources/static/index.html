<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">🎓 Student Management System</h2>

    <!-- FORM -->
    <div class="card p-4 shadow">
        <h4>Add / Update Student</h4>

        <input type="hidden" id="studentId">

        <div class="row mt-3">
            <div class="col">
                <input type="text" id="name" class="form-control" placeholder="Enter Name">
            </div>
            <div class="col">
                <input type="email" id="email" class="form-control" placeholder="Enter Email">
            </div>
            <div class="col">
                <button class="btn btn-primary w-100" onclick="saveStudent()">Save</button>
            </div>
        </div>
    </div>

    <!-- TABLE -->
    <div class="card mt-4 p-4 shadow">
        <h4>Student List</h4>

        <table class="table table-striped mt-3">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>
</div>

<script>
    const API = "http://localhost:8080/students";

    // Load all students
    function loadStudents() {
        fetch(API)
            .then(res => res.json())
            .then(data => {
                let rows = "";

                data.forEach(s => {
                    rows += `
                        <tr>
                            <td>${s.id}</td>
                            <td>${s.name}</td>
                            <td>${s.email}</td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="editStudent(${s.id}, '${s.name}', '${s.email}')">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteStudent(${s.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById("studentTable").innerHTML = rows;
            });
    }

    // Save (Create or Update)
    function saveStudent() {
        const id = document.getElementById("studentId").value;
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;

        const student = { name, email };

        if (id) {
            // UPDATE
            fetch(`${API}/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(student)
            }).then(() => {
                resetForm();
                loadStudents();
            });
        } else {
            // CREATE
            fetch(API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(student)
            }).then(() => {
                resetForm();
                loadStudents();
            });
        }
    }

    // Edit
    function editStudent(id, name, email) {
        document.getElementById("studentId").value = id;
        document.getElementById("name").value = name;
        document.getElementById("email").value = email;
    }

    // Delete
    function deleteStudent(id) {
        if (confirm("Are you sure?")) {
            fetch(`${API}/${id}`, {
                method: "DELETE"
            }).then(() => loadStudents());
        }
    }

    // Reset form
    function resetForm() {
        document.getElementById("studentId").value = "";
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
    }

    // Load on start
    window.onload = loadStudents;
</script>

</body>
</html>
